<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Delvesmith</title>
<style>
:root{--bg:#14121a;--panel:#1f1b28;--panel2:#2a2436;--line:#3a3148;--ink:#efe8dc;--dim:#a99fb8;--accent:#f0a24a;--good:#6fd36f;--bad:#ff6b6b;--magic:#8fb0ff;--rare:#ffd36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
button{font-family:inherit}
#town{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:radial-gradient(ellipse at top,#2a1f1a 0%,var(--bg) 55%)}
#tabs{position:sticky;top:0;z-index:5;display:flex;background:rgba(14,12,19,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:0 6px}
#tabs button{flex:1;background:none;border:none;color:var(--dim);font-size:13px;font-weight:700;padding:14px 4px 12px;border-bottom:3px solid transparent}
#tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding:14px 12px calc(150px + env(safe-area-inset-bottom))}
h1{margin:4px 0 2px;font-size:26px;letter-spacing:2px;color:var(--accent);font-weight:900}
.sub{color:var(--dim);font-size:13px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #2b2538;font-size:14px}
.row:last-child{border-bottom:none}
.row span{color:var(--dim);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block;transform:rotate(45deg)}
.chip small{color:var(--dim)}
.chip.short{border-color:#7a3a3a;color:#ffb0a0}
.btn{appearance:none;border:none;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;color:#1a1208;background:var(--accent);width:100%}
.btn:disabled{background:#3a3346;color:#857a95}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.green{background:#5dd68c}
.btn.blue{background:#6fa8ff}
.btn.danger{background:#e0605a;color:#fff}
.btn.small{padding:8px 12px;font-size:14px;width:auto}
.btn.holding{transform:scale(.98);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn:disabled,.btn.ghost:disabled,.btn.green:disabled,.btn.blue:disabled,.btn.danger:disabled{background:#2a2436;color:#6f6680;border-color:#2a2436;opacity:.7}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #2b2538;font-size:14px}
.set:last-child{border-bottom:none}
.set small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.step{display:flex;align-items:center;gap:6px;flex-shrink:0}
.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:18px;font-weight:800}
.step b{min-width:58px;text-align:center}
.toggle{flex-shrink:0;width:52px;height:30px;border-radius:15px;background:#3a3346;border:none;position:relative}
.toggle.on{background:#5dd68c}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on::after{left:25px}
input.seed{width:100%;background:#120f18;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px;font-size:16px;margin:8px 0}
.bar{height:10px;background:#2b2538;border-radius:6px;overflow:hidden;display:flex}
.bar>div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.advice{font-size:13px;line-height:1.45;background:#191521;border-left:3px solid var(--accent);padding:8px 10px;border-radius:6px;margin-top:8px}
.log{font-size:12px;color:var(--dim);line-height:1.5;max-height:160px;overflow-y:auto;background:#120f18;border-radius:8px;padding:8px;margin-top:8px}
.item{border:1px solid var(--line);background:#120f18;border-radius:12px;padding:12px;font-size:13px;line-height:1.5}
.iname{font-weight:800;font-size:16px;text-align:center}
.ibase{text-align:center;color:var(--dim);font-size:13px}
.ihr{border-top:1px solid var(--line);margin:8px 0}
.iprop{color:#cfc6dc}
.imp{color:#a8d8ff}
.mod{display:flex;gap:8px;align-items:baseline}
.mod .tg{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px;min-width:30px;text-align:center;flex-shrink:0}
.mod.new{animation:flash 1.2s}
@keyframes flash{0%{background:rgba(240,162,74,.45)}100%{background:transparent}}
.cb{width:24px;height:24px;flex-shrink:0;border:2px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#1a1208;font-weight:900;font-size:14px}
.slotrow.picked{border-color:var(--accent);background:#2a2114}.slotrow.picked .cb{background:var(--accent);border-color:var(--accent)}
textarea,input{user-select:text;-webkit-user-select:text}
.r3{color:#ff9a3a}
.chip.r3{border-color:#ff9a3a}
.r0{color:#e2dccf}.r1{color:var(--magic)}.r2{color:var(--rare)}
.row span.r0,.chip.r0{color:#e2dccf}.row span.r1,.chip.r1{color:var(--magic)}.row span.r2,.chip.r2{color:var(--rare)}.row span.r3,.chip.r3{color:#ff9a3a}
.ipick{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#141219;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-weight:700;font-size:15px;text-align:left;cursor:pointer}.ipick small{color:var(--dim);font-weight:500}
.slotrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#191521;margin-bottom:6px}
.slotrow .sl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.slotrow .nm{font-weight:700;font-size:14px}
.slotrow .meta{font-size:12px;color:var(--dim)}
.curgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cur{border:1px solid var(--line);background:#191521;border-radius:10px;padding:9px;text-align:left;color:var(--ink)}
.cur b{display:flex;justify-content:space-between;font-size:14px}
.cur b span{color:var(--accent)}
.cur small{display:block;color:var(--dim);font-size:11px;margin-top:3px;line-height:1.3}
.cur:disabled{opacity:.42}
.cur.on{border-color:var(--accent);background:#2e2416}
#invQ{background:#120f18;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;min-width:0}
select{width:100%;background:#120f18;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}
.recipe{border:1px solid var(--line);background:#191521;border-radius:12px;padding:11px;margin-bottom:8px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rname{font-weight:700;font-size:15px}
.rhave{font-size:12px;color:var(--accent)}
.reff{font-size:12px;color:var(--dim);margin:3px 0 8px}
.rfoot{display:flex;gap:8px;margin-top:8px}
.note{font-size:12px;color:var(--dim);line-height:1.45}
.warn{color:#ff9a7a}
details{font-size:13px;color:#d6cde2;line-height:1.5}
details summary{cursor:pointer;font-weight:700;color:var(--ink)}
.pool{font-size:12px;line-height:1.5}
.pool .ph{color:var(--accent);margin-top:6px;font-weight:700}
#game{position:fixed;inset:0;display:flex;flex-direction:column;background:#0d0b12}
#canvasWrap{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%}
#livePanel{padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #241e2e;background:#0d0b12}
#skillBar{display:flex;gap:6px;margin-bottom:8px}
#skillBar button{flex:1;position:relative;overflow:hidden;height:46px;border-radius:10px;border:1px solid #6a4a2a;background:#2a2016;color:#ffe2b0;font-weight:800;font-size:13px;padding:0 4px}
#skillBar button .cdv{position:absolute;left:0;bottom:0;height:100%;background:rgba(0,0,0,.6);pointer-events:none}
#skillBar button small{display:block;font-size:10px;font-weight:600;color:#a99fb8}
#skillBar.auto button{border-color:#3a3148;background:#1d1926;color:#cfc6dc}
#liveLog{font-size:12px;color:var(--dim);line-height:1.45;height:38px;overflow:hidden;margin-bottom:8px}
#liveBtns{display:flex;gap:8px;align-items:center}
#liveBtns .sp{flex:0 0 auto;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:800;font-size:14px}
#liveBtns .sp.on{border-color:var(--accent);color:var(--accent)}
#pullBtn{flex:1;height:44px;padding:0}
#modal{position:fixed;inset:0;background:rgba(8,6,12,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;touch-action:pan-y}
#modal h2{margin:0 0 10px;font-size:20px}
#mBody{font-size:14px;color:#d6cde2;line-height:1.45;margin-bottom:14px}
#mBtns{display:flex;flex-direction:column;gap:8px}
#tutBar{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:15;background:#231d2e;border:1px solid var(--accent);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:620px;margin:0 auto}
.pulse{animation:pulse 1.6s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,162,74,.9)}100%{box-shadow:0 0 0 14px rgba(240,162,74,0)}}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#2a2436;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:14px;z-index:30;max-width:92vw;transition:opacity .3s;pointer-events:none;text-align:center}
</style>
</head>
<body>

<div id="town">
  <div id="tabs"><button data-tab="run">Run</button><button data-tab="gear">Gear</button><button data-tab="tree">Tree</button><button data-tab="refine">Town</button><button data-tab="social">Social</button><button data-tab="guide">Guide</button></div>
  <div class="wrap" id="view"></div>
</div>

<div id="game" class="hidden">
  <div id="canvasWrap"><canvas id="cv"></canvas></div>
  <div id="livePanel">
    <div id="skillBar"></div>
    <div id="liveLog"></div>
    <div id="watchBtns" class="hidden" style="display:flex;gap:8px;align-items:center"><span class="note" id="watchLbl" style="flex:1"></span><button class="btn small" id="watchBack">Back to town</button></div>
    <div id="liveBtns">
      <button class="sp" data-sp="0">II</button><button class="sp" data-sp="1">1x</button><button class="sp" data-sp="2">2x</button><button class="sp" data-sp="4">4x</button>
      <button class="sp" id="bagBtn" style="width:auto;padding:0 12px">Bag</button>
      <button class="btn danger" id="pullBtn">Pull out</button>
    </div>
  </div>
</div>

<div id="modal" class="hidden"><div class="box"><h2 id="mTitle"></h2><div id="mBody"></div><div id="mBtns"></div></div></div>
<div id="tutBar" class="hidden"></div>
<div id="toast" style="opacity:0"></div>

<script>
(()=>{
const TS=32,RW=20,RH=12;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmtT=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

// ================= DATA =================
const MATS={
  copper:{n:'Copper Ore',c:'#d9824a'},gel:{n:'Slime Gel',c:'#6fd36f'},
  glowcap:{n:'Glowcap',c:'#4fd1c5'},silk:{n:'Spore Silk',c:'#e6dcff'},
  crystal:{n:'Crystal Shard',c:'#c07bff'},ember:{n:'Embersteel',c:'#ff7a3a'},
  starmetal:{n:'Starmetal',c:'#ffd84a'},
  voidshard:{n:'Void Shard',c:'#9a6aff'}
};
const MKEYS=Object.keys(MATS);
const MATVAL={copper:1,gel:1,glowcap:2,silk:2,crystal:3,ember:4,starmetal:10,voidshard:6};
const itemVal=it=>[1.5,3.5,7][it.rarity]+it.ilvl*.3;
const TYPES=['phys','poison','cold','fire'];
const TCOL={phys:'#e8e2d6',poison:'#7ee36b',cold:'#8fd3ff',fire:'#ff9a4a'};
const TNAME={phys:'Physical',poison:'Poison',cold:'Cold',fire:'Fire'};
const BIOMES=[
  {name:'The Mines',floors:'1–4',bg1:'#1d1720',bg2:'#2e211b',tile:'#4e3d30',top:'#7a5f45',speck:'#d9824a',enemy:'#7fd36f',ore:'#d9824a',
   split:{phys:1},eres:{},oreMat:()=>'copper',mobMat:()=>'gel',walker:'Gel Slime',bat:'Cave Bat'},
  {name:'Fungal Caves',floors:'5–9',bg1:'#0d1a1a',bg2:'#172a22',tile:'#2c463b',top:'#4e8a5c',speck:'#4fd1c5',enemy:'#4fd1c5',ore:'#4fd1c5',
   split:{phys:.5,poison:.5},eres:{poison:.6},oreMat:r=>r<.75?'glowcap':'copper',mobMat:r=>r<.7?'silk':'gel',walker:'Sporeling',bat:'Spore Moth'},
  {name:'Crystal Depths',floors:'10–14',bg1:'#100d24',bg2:'#21173a',tile:'#36305a',top:'#7166c0',speck:'#c07bff',enemy:'#c07bff',ore:'#c07bff',
   split:{phys:.4,cold:.6},eres:{cold:.6,phys:.2},oreMat:r=>r<.8?'crystal':'glowcap',mobMat:r=>r<.5?'crystal':'silk',walker:'Crystal Sabertooth',bat:'Crystal Wisp'},
  {name:'Magma Vents',floors:'15–19',bg1:'#1f0d0a',bg2:'#3a160c',tile:'#4a2a22',top:'#c4502a',speck:'#ff8a3a',enemy:'#ff7a3a',ore:'#ff8a3a',
   split:{phys:.4,fire:.6},eres:{fire:.6,phys:.2},oreMat:r=>r<.8?'ember':'crystal',mobMat:r=>r<.6?'ember':'crystal',walker:'Cinder Demon',bat:'Ash Bat'},
  {name:'The Abyss',floors:'20–24',bg1:'#08060f',bg2:'#140c22',tile:'#2a2040',top:'#4a3a70',speck:'#9a6aff',enemy:'#9a6aff',ore:'#c08aff',
   split:{phys:.25,poison:.25,cold:.25,fire:.25},eres:{phys:.1,fire:.2,cold:.2,poison:.2},oreMat:r=>r<.7?'voidshard':'ember',mobMat:r=>r<.45?'voidshard':r<.75?'crystal':'ember',walker:'Void Frog',bat:'Void Eye'}
];
const FMODS={hasted:{n:'Hasted',d:'Monsters move 30% faster',q:10},armored:{n:'Armored',d:'Monsters have 35% more Life',q:15},vicious:{n:'Vicious',d:'Monsters deal 25% more damage',q:15},
  volatile:{n:'Volatile',d:'Monsters explode when they die',q:12},regen:{n:'Regenerating',d:'Monsters regenerate 3% Life per second',q:10},swarming:{n:'Swarming',d:'Rooms hold extra monsters',q:20},
  spiteful:{n:'Spiteful',d:'Many more Spitters',q:12},trapped:{n:'Trapped',d:'Extra traps everywhere',q:10},champions:{n:'Champions',d:'Many more Champions',q:15},drained:{n:'Drained',d:'You cannot regenerate Life',q:15}};
const FMK=Object.keys(FMODS);
const MILD=['trapped','spiteful','regen','volatile'],HEAVY=['champions','swarming','armored','vicious','hasted','drained'];
function abyssMods(floor){const out=[];const c=cycOf(floor);if(c>0){const r=mulberry32(c*4241+11),pool=[...MILD];for(let i=0;i<Math.min(2,c);i++)out.push(pool.splice(Math.floor(r()*pool.length),1)[0])}
  if(floor>=10){const r=mulberry32(floor*977+3),n=Math.max(0,Math.min(4,1+Math.floor((floor-10)/5))-out.length);let heavy=0;const pool=FMK.filter(k=>!out.includes(k));
    for(let i=0;i<n&&pool.length;i++){let k=pool.splice(Math.floor(r()*pool.length),1)[0];if(HEAVY.includes(k)){if(heavy>=2){const alt=pool.filter(x=>!HEAVY.includes(x));if(!alt.length)break;k=alt[Math.floor(r()*alt.length)];pool.splice(pool.indexOf(k),1)}else heavy++}out.push(k)}}return out}
function applyMods(L,e,rng){const M=L.modset;if(!M)return;if(M.armored){e.hp*=1.35;e.max*=1.35}if(M.vicious)e.dmg*=1.25;if(M.hasted)e.speed*=1.3;
  if(M.champions&&e.type==='walker'&&!e.champ&&rng()<.22){e.champ=true;e.hp*=2.6;e.max*=2.6;e.dmg*=1.5;e.w*=1.4;e.h*=1.4;e.name='Champion '+e.name}}
const WCLASS={
  sword:{n:'Sword',reach:20,swing:.2,skills:['cleave','lunge','guard']},
  axe:{n:'Axe',reach:22,swing:.26,skills:['whirl','rend','cry']},
  hammer:{n:'Hammer',reach:26,swing:.36,skills:['slam','quake','iron']},
  staff:{n:'Staff',reach:18,swing:.24,range:4.5,skills:['fireball','nova','heal']},
  daggers:{n:'Dual Daggers',reach:16,swing:.13,skills:['flurry','shadow','smoke']},
  bow:{n:'Bow',reach:16,swing:.26,range:5,skills:['multi','rain','disengage']}
};
const SKILLS={
  cleave:{n:'Cleave',cd:4,d:'Hit every enemy around you for 150% damage.'},
  lunge:{n:'Lunge',cd:6,d:'Dash up to 4 tiles to an enemy and strike for 200%.'},
  guard:{n:'Guard',cd:12,d:'Take 50% less damage for 3 seconds.'},
  whirl:{n:'Whirlwind',cd:9,d:'Spin for 2 seconds, hitting everything nearby 8 times for 60%.'},
  rend:{n:'Rend',cd:5,d:'A brutal chop on one enemy for 250%.'},
  cry:{n:'War Cry',cd:15,d:'+40% damage for 6 seconds.'},
  slam:{n:'Ground Slam',cd:7,d:'180% to nearby enemies and stun them for 1.5 seconds.'},
  quake:{n:'Earthquake',cd:12,d:'After 1 second the ground erupts for 300% in a wide area.'},
  iron:{n:'Iron Skin',cd:14,d:'Take 40% less damage for 6 seconds.'},
  fireball:{n:'Fireball',cd:4,d:'A blazing orb that explodes for 200% in an area.'},
  nova:{n:'Frost Nova',cd:8,d:'120% to everything nearby and slow them 50% for 3 seconds.'},
  heal:{n:'Mend',cd:20,d:'Restore 30% of your Life.'},
  flurry:{n:'Flurry',cd:5,d:'6 lightning-fast stabs for 60% each.'},
  shadow:{n:'Shadow Step',cd:7,d:'Teleport behind an enemy and land a guaranteed crit for 250%.'},
  smoke:{n:'Smoke Bomb',cd:14,d:'Melee attacks miss you for 3 seconds.'},
  multi:{n:'Multishot',cd:5,d:'Fire 5 arrows in a spread for 80% each.'},
  rain:{n:'Rain of Arrows',cd:10,d:'6 volleys pound an area for 60% each.'},
  disengage:{n:'Disengage',cd:8,d:'Leap away from enemies and move 30% faster for 3 seconds.'}
};
const BOSSN=['Gel King','Sporemother','Prism Golem','Cinder Tyrant'];
const BOSSKIT=[
  [{k:'slam',n:'Belly Slam',cd:6},{k:'barrage',n:'Gel Spray',cd:7,n2:3}],
  [{k:'barrage',n:'Spore Storm',cd:6,n2:5},{k:'summon',n:'Brood Call',cd:10,n2:2},{k:'slam',n:'Rot Burst',cd:9}],
  [{k:'volley',n:'Shard Volley',cd:5,n2:12},{k:'ring',n:'Frost Ring',cd:8},{k:'slam',n:'Shatter',cd:10}],
  [{k:'meteor',n:'Meteor Fall',cd:5,n2:4},{k:'volley',n:'Flame Wave',cd:7,n2:10},{k:'summon',n:'Call Imps',cd:14,n2:2}]
];
function mkBoss(b,floor,cx,cy,room){
  const hp=mHP(floor)*9,dmg=mDMG(floor)*1.5;
  return{type:'boss',boss:true,bk:b,name:BOSSN[b],room,x:cx-24,y:cy-22,w:48,h:44,hx:cx,hy:cy,vx:0,vy:0,dir:1,speed:42,hp,max:hp,dmg,iv:1.8,cd:1,wind:0,hurt:0,kb:0,t:0,think:0,aggro:false,ac:Object.fromEntries(BOSSKIT[b].map((a,i)=>[a.k,2+i*1.5])),gcd:0,enr:false};
}

function holdBtn(el,ms,fn){

  const reset=()=>{cancelAnimationFrame(raf);t0=0;el.style.background='';el.classList.remove('holding')};
  const tick=()=>{if(!t0)return;const k=Math.min(1,(performance.now()-t0)/ms);el.style.background=`linear-gradient(90deg,#7a1f1b ${k*100}%,${base} ${k*100}%)`;
    if(k>=1){done=true;reset();if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}fn();return}raf=requestAnimationFrame(tick)};
  el.addEventListener('pointerdown',e=>{if(el.disabled)return;e.preventDefault();done=false;t0=performance.now();el.classList.add('holding');try{el.setPointerCapture(e.pointerId)}catch(_){}raf=requestAnimationFrame(tick)});
  ['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>{if(t0&&!done)toast('Keep holding to confirm');reset()}));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

function dmgBar(taken){
  const tot=TYPES.reduce((a,k)=>a+taken[k],0)||1;
  return `<div class="bar">${TYPES.map(k=>taken[k]>0?`<div style="width:${taken[k]/tot*100}%;background:${TCOL[k]}"></div>`:'').join('')}</div>
   <div class="legend">${TYPES.filter(k=>taken[k]>0).map(k=>`<span><i style="background:${TCOL[k]}"></i>${TNAME[k]} ${Math.round(taken[k]/tot*100)}%</span>`).join('')||'<span>No damage taken</span>'}</div>`;
}
function advice(rep,st){
  const out=[],tot=TYPES.reduce((a,k)=>a+rep.taken[k],0);
  if(tot>0){
    const top=TYPES.slice().sort((a,b)=>rep.taken[b]-rep.taken[a])[0],pct=Math.round(rep.taken[top]/tot*100);
    if(top==='phys'&&pct>50)out.push(`${pct}% of the damage you took was <b>Physical</b>. Your Armour is ${st.armour}. Look for Armour, % increased Armour and Life on helmet, body and boots.`);
    else if(top!=='phys'){const ess={poison:'Essence of Rot',cold:'Essence of Frost',fire:'Essence of Cinders'}[top];
      out.push(`${pct}% of the damage you took was <b style="color:${TCOL[top]}">${TNAME[top]}</b>, and your ${TNAME[top]} Resistance is only ${st.res[top]}%. Craft ${TNAME[top]} Resistance: <b>${ess}</b> guarantees it.`)}
  }
  if(rep.avgKill>5)out.push(`An average kill took <b>${rep.avgKill.toFixed(1)}s</b>, so your damage is falling behind. Upgrade your weapon (flat damage, % Physical, Attack Speed) or find a better base.`);
  const fr=BIOMES[biomeOf(rep.floor)];
  if(fr.eres.cold&&st.addCold>0&&st.addCold>=st.addFire+st.addPoison)out.push('Crystal monsters resist Cold. Fire or Poison damage works better down there.');
  if(rep.trapTaken&&tot>0&&rep.trapTaken/tot>.25)out.push(`${Math.round(rep.trapTaken/tot*100)}% of your damage came from traps and puddles. ${st.dodge<20?`Your Hazard Dodge is only ${st.dodge}%. Boots like Dancer's Slippers, and suffixes like "of the Fox" on boots, gloves, helmets, amulets and belts, teach the runner to sidestep them.`:'More Hazard Dodge and Movement Speed help the runner get out of the way.'}`);
  if(rep.lostFull>0)out.push(`<b>${rep.lostFull}</b> drops were lost to a full bag. Suffixes "of Pockets/Pouches/Packs" (body, boots) add capacity.`);
  if(!out.length)out.push(rep.outcome==='died'?'Close call. Try setting your retreat HP a little higher.':'Clean run. Try a deeper target floor.');
  return out.map(a=>`<div class="advice">${a}</div>`).join('');
}
function reportHTML(rep,st){
  const died=rep.outcome==='died';

  h+=xpLine(rep);
  if(died&&rep.deathCause)h+=`<div class="note warn" style="margin-bottom:8px">Killed by ${rep.deathCause}</div>`;
  if(rep.charmName&&died)h+=`<div class="note" style="margin-bottom:6px">Your <b>${rep.charmName}</b> shattered and saved ${Math.round(rep.charmSave*100)}% of your bag.</div>`;
  h+=`<div class="note" style="margin:6px 0 4px">${died?'Kept':'Banked'}:</div>${matList(rep.keptMats)}`;
  if(rep.keptItems.length)h+=`<div class="chips" style="margin-top:6px">${rep.keptItems.map(i=>`<span class="chip r${i.rarity}">${itemName(i)}</span>`).join('')}</div>`;
  if(died&&(rep.lostUnits>0))h+=`<div class="note warn" style="margin:8px 0 4px">Lost:</div>${matList(rep.lostMats)}${rep.lostItems.length?`<div class="chips" style="margin-top:6px">${rep.lostItems.map(i=>`<span class="chip short">${itemName(i)}</span>`).join('')}</div>`:''}`;

  h+=`<div class="note" style="margin:12px 0 4px">Damage taken by type</div>${dmgBar(rep.taken)}`;
  h+=`<div class="note" style="margin-top:8px">Damage dealt: ${rep.dealt} · Avg time per kill: ${rep.avgKill.toFixed(1)}s</div>`;

}

function applyResult(res,charm){
  const died=res.outcome==='died',frac=died?(charm?charm.save:0):1;
  const keptMats={},lostMats={};let lostUnits=0;
  const gb=typeof guildBuffPct==='function'?guildBuffPct():0;
  for(const k in res.bag){const v=res.bag[k],kv=Math.floor(v*frac*(1+gb/100)+1e-9);keptMats[k]=kv;lostMats[k]=Math.max(0,v-Math.floor(v*frac+1e-9));lostUnits+=lostMats[k];S.mats[k]=(S.mats[k]||0)+kv}
  const nk=res.hoarder?res.items.length:Math.floor(res.items.length*frac+1e-9),keptItems=res.items.slice(0,nk),lostItems=res.items.slice(nk);lostUnits+=lostItems.length;
  for(const it of keptItems){if(S.inv.length<S.invCap)S.inv.push(it);else{const m=salvageMats(it);for(const k in m)S.mats[k]=(S.mats[k]||0)+m[k]}}
  if(died&&charm)S.charm=null;
  S.best=Math.max(S.best,res.floor);S.cleared=Math.max(S.cleared||0,res.cleared||0);
  for(const m of res.maps||[])if(S.maps.length<30)S.maps.push(m);
  for(const k in res.cur||{})S.cur[k]=(S.cur[k]||0)+res.cur[k];
  const ups=gainXP((res.xp||0)*(1+.1*(S.town.training||0)));S.bossKills=(S.bossKills||0)+(res.bosses||0);
  const rep=Object.assign({},res,{levelUps:ups,newLvl:S.lvl,keptMats,lostMats,keptItems,lostItems,lostUnits,charmName:charm?charm.n:null,charmSave:charm?charm.save:0});
  delete rep.log;delete rep.items;rep.logTail=res.log.slice(-14);
  try{guildWeekCount(res);clearTimeout(pushMember.t);pushMember.t=setTimeout(pushMember,1500)}catch(e){}
  S.report=rep;persist();snapNow();backupPrompt();empIntro();updTabDots();return rep;
}
function salvageMats(it){const b=biomeOf(it.ilvl),sets=[['copper','gel'],['glowcap','silk'],['crystal','silk'],['ember','crystal'],['voidshard','ember']][b],n=1+it.rarity+Math.floor(it.ilvl/3),o={};for(let i=0;i<n;i++){const k=sets[i%2];o[k]=(o[k]||0)+1}

}

  h+=sec('Runs, expeditions and retreating',`<p style="margin:0 0 8px"><b>Single run:</b> watch now, with speed controls, a Bag button to drop loot, and a Pull out button.</p>
    <p style="margin:0 0 8px"><b>Idle expedition:</b> back-to-back runs for 15 minutes to 8 hours, with a 4-minute rest between runs. Watch live anytime, or Recall early. Normal items are salvaged automatically.</p>
    <p style="margin:0 0 8px"><b>Dying</b> loses everything in the bag, unless a <b>charm</b> saves part of it. Your stash at home is always safe.</p>
    <p style="margin:0"><b>Retreat settings:</b> "Retreat at HP" turns back mid-floor, "Go deeper only above" decides at each exit. Hitting the retreat line breaks off any fight right away and runs for the entrance. "Target floor" and "Leave when bag is full" also end a run. Beat a floor to unlock starting on the next one.</p>`);
  h+=sec('Damage, biomes and resistances',`<p style="margin:0 0 8px">Each biome hits with a different damage type. Its monsters also resist one type, so your own damage type matters too.</p>${BIOMES.map(b=>`<div class="row" style="display:block"><b>Floors ${b.floors} · ${b.name}</b><div class="note">Hits with ${Object.keys(b.split).map(k=>`<span style="color:${TCOL[k]}">${TNAME[k]}</span>`).join(' + ')}${Object.keys(b.eres).length?' · monsters resist '+Object.keys(b.eres).map(k=>TNAME[k]).join(', '):''}</div></div>`).join('')}
    <p style="margin:8px 0 0"><b>Armour</b> reduces Physical damage. <b>Resistances</b> (max 75%) reduce Poison, Cold and Fire damage. The run report shows what hurt you most.</p>`);
  h+=sec('Monsters and traps',`<ul style="padding-left:18px;margin:0">
    <li><b>Brutes</b> (slimes, sporelings…) walk up and hit hard. <b>Champions</b> glow gold and drop guaranteed gear.</li>
    <li><b>Bats</b> are fast and weave around.</li>
    <li><b>Spitters</b> keep their distance and lob globs that leave damaging puddles. A red dashed circle shows where a glob will land.</li>
    <li><b>Spike gates</b> block corridors and pop up on a timer (they flash red first). Getting caught hurts and makes you bleed. In the Fungal Caves they're <b>spider webs</b> instead, which slow you down.</li>
    <li><b>Fire vents</b> in rooms flare on a timer and glow orange first. Getting caught burns you for a couple of seconds.</li>
    <li><b>Mine carts</b> rattle back and forth along tracks in the Mines. Getting run over hurts and slows you.</li>
    <li><b>Dart turrets</b> sit on walls and shoot across rooms. Their darts match the biome: cold in the Depths, and in the Vents they spit <b>fireballs</b>. In the Caves they're <b>gas launchers</b> that lob clouds of spore gas.</li>
    <li><b>Hidden snares</b> (depth 2+) are invisible. Stepping on one hurts and slows the runner to a crawl for 2 seconds, which lets monsters catch up.</li>

  h+=sec('Weapons and skills',`<p style="margin:0 0 8px">Every weapon type attacks differently and has <b>3 skills</b>. In a <b>single run</b> you tap the skill buttons yourself. In <b>idle expeditions</b> the runner casts them automatically when they make sense. Skills hit harder as your weapon gets better.</p>${Object.keys(WCLASS).map(c=>`<div class="row" style="display:block"><b>${WCLASS[c].n}${WCLASS[c].range?' (ranged)':''}</b>${WCLASS[c].skills.map(k=>`<div class="note"><b style="color:#ffe2b0">${SKILLS[k].n}</b> (${SKILLS[k].cd}s): ${SKILLS[k].d}</div>`).join('')}</div>`).join('')}`);
  h+=sec('Bosses',`<p style="margin:0 0 8px">The last floor of each biome (4, 9, 14, 19…) ends with the biome's boss guarding the exit, and the 3rd floor of each biome (7, 12, 17…) has a <b>Warden</b>: a huge Champion with guards and a bonus chest. The exit and stairs stay <b>sealed</b> until it falls. Bosses telegraph their big attacks with red circles (Hazard Dodge helps), get <b>enraged</b> at half Life, and drop 2 items, piles of materials, Starmetal and a lot of XP.</p>${BOSSN.map((n,i)=>`<div class="row" style="display:block"><b>${n}</b> <span class="note">(${BIOMES[i].name})</span><div class="note">${BOSSKIT[i].map(a=>a.n).join(' · ')}${i===0?' · splits into slimes when enraged':''}</div></div>`).join('')}`);
  h+=sec('Levels and the skill tree',`<p style="margin:0">Every kill gives XP: more on deeper floors, 5× for Champions and 30× for bosses. XP is kept <b>even if the runner dies</b>. Each level gives 1 point for the <b>Tree</b> tab, which has five sections: <span style="color:#ff8a6a">Might</span> (attack damage for every weapon except staves), <span style="color:#b48cff">Sorcery</span> (spell damage for staves, plus elemental damage), <span style="color:#8fb0ff">Fortitude</span> (defense), <span style="color:#7ee36b">Cunning</span> (dodge, speed, loot and cooldowns) and <span style="color:#ffd36a">Weapons</span>. In Weapons, each weapon type has a Mastery, an Adept node, and three ✦ nodes that change how its skills work, like Split Fire turning Fireball into 3 orbs. Weapon nodes only work while that weapon is equipped. There are far more nodes than points, so pick a build. You can reset the tree for a few materials.</p>`);
  h+=sec('Endgame: the Abyss, maps, uniques',`<p style="margin:0 0 8px"><b>Endless depth:</b> a new biome starts at every multiple of 5 (the Mines are the short first one, depths 1–4). Checkpoints sit at depth 1, 5, 10, 15… After the Abyss (20–24) the biomes loop as <b>Tier II, III…</b> with Elder and Ancient monsters. Monsters get a little stronger every floor on a smooth curve: steeper early on, then a steady climb with no sudden jumps. The <b>Danger</b> number shows how much. Floor modifiers like Hasted or Volatile only appear on <b>Delve Maps</b> and in the <b>weekly challenge</b>. Deeper floors drop more materials and items, and from depth 8 monsters sometimes drop crafting currency directly. The top modifier tier (T1) needs item level 20, <b>Abyssal</b> needs item level 25, and Void bases drop from depth 20. <b>Empower</b> any item in Town → Empowering for an endless +5% per level.</p>
    <p style="margin:0 0 8px"><b>Delve Maps</b> are rare: bosses drop one about a third of the time, and deep Champions and chests very rarely. Clear a map and you <b>choose one of three rewards</b> (unique item, rare gear, currency, Empowering materials or a deeper map). More modifiers mean bigger rewards. A map is one floor with 1–4 modifiers you choose to take on for more loot and XP, and it always ends in a boss. Run them from the Run tab, and reroll a bad roll for a few materials.</p>
    <p style="margin:0"><b>Unique items</b> (orange) have fixed modifiers and an effect that shapes your build. Each boss has its own drops, and Abyss bosses can drop any of them. Uniques can't be crafted, but Divine Dust rerolls their values.</p>${UQK.map(k=>`<div class="row" style="display:block"><b style="color:#ff9a3a">${UNIQ[k].n}</b> <span class="note">(${BASES[UNIQ[k].base].n} · ${UNIQ[k].src.map(i=>i===4?'Abyss bosses':BOSSN[i]).join(', ')})</span><div class="note">${UNIQ[k].d}</div></div>`).join('')}`);
  h+=sec('Town, prestige and the weekly challenge',`<p style="margin:0 0 8px"><b>Town buildings</b> are where spare materials go: the Refinery makes refining cheaper, the Smithy improves crafting rolls, Training Grounds add XP, and the Runner Lodge shortens rest between expedition runs.</p>
    <p style="margin:0 0 8px"><b>Prestige:</b> at level 60, Ascend back to level 1 for a permanent +3% damage and Life each time, plus a title.</p>
    <p style="margin:0"><b>Weekly Challenge:</b> everyone gets the same dungeon for a week. Go as deep as you can. Your best run is saved, and posted to the shared leaderboard when this link supports it.</p>`);
  h+=sec('Gear basics',`<ul style="padding-left:18px;margin:0">
    <li><b>10 slots:</b> weapon, helmet, body, gloves, boots, belt, amulet, 2 rings and a backpack. Backpacks and belts add bag space.</li>
    <li><b>Item level</b> (ilvl) is the floor an item dropped on. Better modifier tiers need higher item levels: the top tiers unlock at item level 25, 40, 60 and 80, and stronger Deepsteel, Starforged and Primordial bases start dropping at depth 40, 60 and 80.</li>
    <li><b>Rarity:</b> <span class="r0">Normal</span> has no modifiers, <span class="r1">Magic</span> has up to 1 prefix and 1 suffix, and <span class="r2">Rare</span> has up to 3 of each.</li>

    <p style="margin:8px 0 0"><b>A typical path:</b> Tinker (Normal to Magic), then Graft, then Crown (to Rare), then Ascension to fill it. Use Chaos or Void to reroll bad modifiers, and Seals to protect the good half. An <b>Essence</b> adds one guaranteed high-tier modifier without touching the others (Normal becomes Magic, a full Magic becomes Rare), but each item can only take <b>one</b> essence. Removing the essence's modifier doesn't change that; only <b>Scouring Sand</b> (which wipes the whole item) lets it take another.</p>`);
  h+=sec('Materials',`${MKEYS.map(k=>`<div class="row"><span style="text-align:left;color:${MATS[k].c}">${MATS[k].n}</span><span>${{copper:'Mines ore',gel:'Mines monsters',glowcap:'Fungal ore',silk:'Fungal monsters',crystal:'Crystal Depths',ember:'Magma Vents',starmetal:'Chests, Champions and bosses, floor 3+',voidshard:'The Abyss, floor 9+'}[k]}</span></div>`).join('')}`);
  h+=sec('Saving your progress',`<p style="margin:0">Progress saves automatically in this browser. Clearing browser data or switching devices can lose it, so use <b>Back up</b> on the Run tab to copy a code, and <b>Restore</b> to load it anywhere.</p>`);
  $('#view').innerHTML=h;
  $('#tutToggle').onclick=()=>{S.tutOff=S.tutOff?0:1;persist();viewGuide();tutTick()};

  if(rep.history&&rep.history.length)h+=`<div class="chips" style="margin-bottom:8px">${rep.history.map(r=>`<span class="chip" style="padding:2px 7px;${r.o?'':'border-color:#7a3a3a;color:#ffb0a0'}">F${r.f}${r.o?'':' ✗'}</span>`).join('')}</div>`;
  if(rep.charmName)h+=`<div class="note" style="margin-bottom:6px">Your <b>${rep.charmName}</b> shattered on the first death and saved part of that bag.</div>`;
  h+=xpLine(rep);
  h+=`<div class="note" style="margin:6px 0 4px">Banked:</div>${matList(rep.mats)}`;
  if(rep.items.length)h+=`<div class="chips" style="margin-top:6px">${rep.items.slice(0,24).map(i=>`<span class="chip r${i.rarity}">${itemName(i)}</span>`).join('')}${rep.items.length>24?`<span class="chip">+${rep.items.length-24} more</span>`:''}</div>`;
  const notes=[];if(rep.salv)notes.push(`${rep.salv} Normal items were salvaged automatically.`);if(rep.fullSalv)notes.push(`${rep.fullSalv} items were salvaged because your inventory was full.`);if(rep.lost)notes.push(`${rep.lost} things were lost to deaths.`);
  if(notes.length)h+=`<div class="note" style="margin-top:8px">${notes.join(' ')}</div>`;
  h+=`<div class="note" style="margin:12px 0 4px">Damage taken by type</div>${dmgBar(rep.taken)}`;
  h+=`<div class="note" style="margin-top:8px">Avg time per kill: ${rep.avgKill.toFixed(1)}s</div>`+advice(rep,st);
  return h;
}

function mapReward(mp){const F=mp.floor,n=mp.n,R=Math.random,sc=1+n*.25,opts=[];

  const all=[
    {id:'unique',w:F>=8?2:0,mk:()=>{const it=mkUnique(UQK[Math.floor(R()*UQK.length)],R,F+2);return{t:'Unique item',d:`<span style="color:#ff9a3a">${itemName(it)}</span> (${BASES[it.base].n})`,give:()=>{S.inv.push(it)}}}},

    {id:'cur',w:3,mk:()=>{const o=curPick();return{t:'Currency cache',d:Object.entries(o).map(([k,v])=>`${v} ${CUR[k].n}`).join(', '),give:()=>{for(const k in o)S.cur[k]=(S.cur[k]||0)+o[k]}}}},
    {id:'emp',w:2,mk:()=>{const o={crystal:Math.round((8+F)*sc),ember:Math.round((4+F/2)*sc),starmetal:Math.round((2+F/5)*sc)};if(F>=16)o.voidshard=Math.round((2+F/6)*sc);return{t:'Empowering materials',d:Object.entries(o).map(([k,v])=>`${v} ${MATS[k].n}`).join(', '),give:()=>{for(const k in o)S.mats[k]=(S.mats[k]||0)+o[k]}}}},
    {id:'map',w:2,mk:()=>{const m=mkMap(R,F+2,Math.min(4,n+1));return{t:'Deeper Delve Map',d:`Depth ${m.floor} map with ${m.mods.length} modifiers (+${m.q}% loot)`,give:()=>{if(S.maps.length<30)S.maps.push(m)}}}}];
  const pool=all.filter(o=>o.w>0);while(opts.length<3&&pool.length){const tot=pool.reduce((a,o)=>a+o.w,0);let x=R()*tot,i=0;while(x>pool[i].w){x-=pool[i].w;i++}opts.push(pool.splice(i,1)[0].mk())}
  modal('Map complete: choose a reward',`<div class="note" style="margin-bottom:8px">You cleared a depth ${F} map with ${n} modifier${n===1?'':'s'}. More modifiers mean bigger rewards. Pick one.</div>`+opts.map((o,i)=>`<div class="recipe" style="margin-bottom:6px"><div class="rhead"><span class="rname">${i+1}. ${o.t}</span></div><div class="note" style="margin-top:4px">${o.d}</div></div>`).join(''),

const dayId=()=>Math.floor((Date.now()/86400000));
const RAID_PER_DAY=3,ARENA_PER_DAY=5;
const RAIDN=['The Hollow King','Gloom Leviathan','Ember Colossus','Rime Matriarch','The Unmaker','Ashen Wyrm','Void Shepherd'];
function usesLeft(key,per){const o=S[key];return o&&o.d===dayId()?Math.max(0,per-o.n):per}
function useOne(key){const d=dayId();if(!S[key]||S[key].d!==d)S[key]={d,n:0};S[key].n++;persist()}
function raidLevel(ms){const avg=ms.length?ms.reduce((a,m)=>a+(m.best||1),0)/ms.length:1;return Math.max(3,Math.round(avg*.9))}
// ---- raid
async function raidView(){const F=FB.F,b=SB();if(!S.guild){b.innerHTML='<div class="card"><h3>Party raid</h3><div class="note">Raids are a guild activity. Join or start a guild in the Guild tab first.</div></div>';return}
  try{const g=await F.getDoc(F.doc(FB.db,'guilds',S.guild));SOC.guild=g.exists()?{id:g.id,...g.data()}:null;const ms=await F.getDocs(F.collection(FB.db,'guilds',S.guild,'members'));SOC.members=ms.docs.map(d=>d.data())}catch(e){b.innerHTML='<div class="note">Can\'t reach the raid right now.</div>';return}
  const wk=weekId(),rref=F.doc(FB.db,'guilds',S.guild,'raids','w'+wk);
  try{let r=await F.getDoc(rref);if(!r.exists()){const lv=raidLevel(SOC.members),n=Math.max(1,SOC.members.length);await F.setDoc(rref,{name:RAIDN[wk%RAIDN.length],lv,hp:Math.round(mHP(lv)*45*n),members:n,created:Date.now()});r=await F.getDoc(rref)}SOC.raid={id:r.id,...r.data()}}catch(e){b.innerHTML='<div class="note">Can\'t start the raid ('+esc((e&&e.code)||'error')+')</div>';return}
  SOC.unsub.push(F.onSnapshot(F.collection(FB.db,'guilds',S.guild,'raids','w'+wk,'hits'),sn=>{SOC.hits=sn.docs.map(d=>d.data());renderRaid()},()=>{}));renderRaid()}
function renderRaid(){const b=SB(),r=SOC.raid;if(!b||!r||S.tab!=='social'||S.socTab!=='raid')return;
  const hits=(SOC.hits||[]).sort((a,c)=>c.dmg-a.dmg),tot=hits.reduce((a,h)=>a+(h.dmg||0),0),left=Math.max(0,r.hp-tot),dead=left<=0,me=hits.find(h=>h.uid===fbUser.uid),ul=usesLeft('raidAtt',RAID_PER_DAY),claimed=(S.raidClaim||{})[r.id+S.guild];
  b.innerHTML=`<div class="card" style="background:linear-gradient(135deg,#2a1420,var(--panel))"><div class="note" style="letter-spacing:1.5px">THIS WEEK'S RAID BOSS · LEVEL ${r.lv}</div><h3 style="margin:4px 0 10px;font-size:20px;color:#ffb070">${esc(r.name)}</h3>
    <div style="height:16px;background:#120f18;border-radius:8px;overflow:hidden;border:1px solid var(--line)"><div style="height:100%;width:${Math.max(0,left/r.hp*100)}%;background:linear-gradient(90deg,#b8323a,#ff6b5a)"></div></div>
    <div class="note" style="margin-top:4px">${dead?'<b style="color:#5dd68c">Defeated!</b>':`${fmtN(left)} / ${fmtN(r.hp)} health left`} · resets every week</div>
    ${dead?(me&&me.dmg>0?(claimed?'<div class="note" style="margin-top:10px">You claimed your reward. A new boss arrives next week.</div>':`<button class="btn" id="rClaim" style="margin-top:10px">Claim raid reward</button>`):'<div class="note" style="margin-top:10px">You didn\'t hit this boss, so there\'s no reward this time.</div>'):
      `<button class="btn" id="rAtk" style="margin-top:10px" ${ul?'':'disabled'}>Attack (${ul}/${RAID_PER_DAY} left today)</button><div class="note" style="margin-top:6px">Your runner fights for up to 30 seconds with your current gear. Every member's damage adds up, and everyone who hits it shares the loot.</div>`}</div>
  <div class="card"><h3>Damage dealt</h3>${hits.length?hits.map((h,i)=>`<div class="row"><span style="text-align:left;color:${h.uid===fbUser.uid?'var(--accent)':'var(--ink)'}">${i+1}. ${esc(h.name)}</span><span>${fmtN(h.dmg)} · ${h.n||1} hit${(h.n||1)===1?'':'s'}</span></div>`).join(''):'<div class="note">Nobody has attacked yet.</div>'}</div>`;
  const a=$('#rAtk');if(a)a.onclick=raidAttack;const c=$('#rClaim');if(c)c.onclick=()=>raidClaim(me,tot)}
const fmtN=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?Math.round(n/1e3)+'k':String(Math.round(n));
function raidFightResult(lv){const p=gearParts(S.eq,lv),raw=mDMG(lv)*1.5,surv=Math.min(30,p.ehp/(raw*.3)),dps=p.st.dps*(.9+Math.random()*.2);return{dmg:Math.round(dps*surv),surv,dps}}
async function raidAttack(){if(!usesLeft('raidAtt',RAID_PER_DAY))return;if(S.idle){toast('Your runner is out on an expedition');return}const r=SOC.raid,F=FB.F,res=raidFightResult(r.lv);useOne('raidAtt');
  const ref=F.doc(FB.db,'guilds',S.guild,'raids',r.id,'hits',fbUser.uid),cur=(SOC.hits||[]).find(h=>h.uid===fbUser.uid);
  const bl=Math.max(0,(SOC.raid.hp-(SOC.hits||[]).reduce((x,h)=>x+(h.dmg||0),0))/SOC.raid.hp);fightAnim(myName(),r.name,res.surv>=30?.3+.5*Math.random():0,Math.max(0,bl-res.dmg/r.hp),res.surv>=30,`${fmtN(res.dmg)} damage in ${res.surv.toFixed(1)}s`,async()=>{
    try{await F.setDoc(ref,{uid:fbUser.uid,name:myName(),dmg:(cur?cur.dmg:0)+res.dmg,n:(cur?cur.n||1:0)+1,at:Date.now()})}catch(e){toast('Hit not recorded ('+((e&&e.code)||'error')+')')}
    toast(res.surv>=30?`Survived! Dealt ${fmtN(res.dmg)} damage`:`Knocked out after ${res.surv.toFixed(1)}s, dealt ${fmtN(res.dmg)}`)})}
function raidClaim(me,tot){const r=SOC.raid,share=Math.min(1,me.dmg/Math.max(1,tot)),lv=r.lv,R=Math.random;S.raidClaim=S.raidClaim||{};if(S.raidClaim[r.id+S.guild])return;
  const pool=['chaos','chaos','divine','ascend','void','crown'],cur={};for(let i=0;i<3+Math.floor(share*10)+Math.floor(lv/10);i++){const k=pool[Math.floor(R()*pool.length)];cur[k]=(cur[k]||0)+1}
  let it=genItem(R,lv+5,1.5);let g=0;while(it.rarity<2&&g++<20)it=genItem(R,lv+5,1.5);const items=[it];if(share>=.15&&R()<.35+share)items.push(mkUnique(UQK[Math.floor(R()*UQK.length)],R,lv+3));
  const mats={crystal:Math.round(10+lv*(.5+share)),starmetal:Math.round(2+lv/6)};
  for(const k in cur)S.cur[k]=(S.cur[k]||0)+cur[k];for(const k in mats)S.mats[k]=(S.mats[k]||0)+mats[k];for(const x of items)S.inv.push(x);S.raidClaim[r.id+S.guild]=1;persist();
  modal('Raid reward!',`You did ${Math.round(share*100)}% of the damage.<br><br>${items.map(x=>`<div class="nm r${x.rarity}" style="font-weight:700">${esc(itemName(x))}</div>`).join('')}<div style="margin-top:8px">${Object.entries(cur).map(([k,v])=>`<span class="chip">${v} ${CUR[k].n}</span>`).join(' ')} ${Object.entries(mats).map(([k,v])=>chip(k,v)).join(' ')}</div>`,[{label:'Nice!',fn:()=>render()}])}
// ---- arena
function arenaStats(){const st=computeStats(S.eq);return{dps:st.dps,life:st.life,armour:st.armour,res:{fire:st.res.fire,cold:st.res.cold,poison:st.res.poison},dodge:st.dodge,aps:st.aps,loh:st.lifeOnHit,regen:st.regen,wclass:st.wclass}}
async function pushArena(){if(!(FB&&fbUser))return;const F=FB.F;try{await F.setDoc(F.doc(FB.db,'arena',fbUser.uid),{uid:fbUser.uid,name:myName(),rating:Math.round(S.rating||1000),best:S.best||0,lvl:S.lvl||1,stats:arenaStats(),wins:S.arenaW||0,losses:S.arenaL||0,at:Date.now()})}catch(e){}}
function duel(A,B,seed){// returns {win, aLeft, bLeft, t}
  const r=mulberry32(seed),eff=(X,Y)=>{const hit=X.dps/Math.max(.3,X.aps),dr=Math.min(.8,Y.armour/(Y.armour+5*hit+1)),avgRes=(Y.res.fire+Y.res.cold+Y.res.poison)/300;return X.dps*(.5*(1-dr)+.5*(1-avgRes))*(1-Y.dodge/250)};
  let a=A.life,b=B.life;const ea=eff(A,B),eb=eff(B,A),sa=(A.loh||0)*A.aps+(A.regen||0),sb=(B.loh||0)*B.aps+(B.regen||0);let t=0;
  while(a>0&&b>0&&t<90){const dt=.25;b-=ea*dt*(.75+r()*.5);a-=eb*dt*(.75+r()*.5);a=Math.min(A.life,a+sa*dt);b=Math.min(B.life,b+sb*dt);t+=dt}
  const win=b<=0&&a>0?true:a<=0&&b>0?false:(a/A.life>=b/B.life);return{win,aLeft:Math.max(0,a/A.life),bLeft:Math.max(0,b/B.life),t}}
async function arenaView(){const F=FB.F;S.rating=S.rating||1000;await pushArena();
  try{const sn=await F.getDocs(F.query(F.collection(FB.db,'arena'),F.orderBy('rating','desc'),F.limit(50)));SOC.arena=sn.docs.map(d=>d.data())}catch(e){SOC.arena=[]}
  renderArena()}
function renderArena(){const b=SB();if(!b||S.tab!=='social'||S.socTab!=='arena')return;const ul=usesLeft('arenaAtt',ARENA_PER_DAY),me=arenaStats(),list=SOC.arena||[];
  const opps=list.filter(o=>o.uid!==fbUser.uid).sort((x,y)=>Math.abs(x.rating-S.rating)-Math.abs(y.rating-S.rating)).slice(0,6);
  b.innerHTML=`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="note" style="letter-spacing:1.5px">YOUR RATING</div><div style="font-size:34px;font-weight:900;color:#ffe2b0">${Math.round(S.rating)}</div><div class="note">${S.arenaW||0} wins · ${S.arenaL||0} losses</div></div><div style="text-align:right"><div class="note">Fights today</div><b>${ul}/${ARENA_PER_DAY}</b><div class="note" style="margin-top:4px">DPS ${Math.round(me.dps)} · Life ${me.life}</div></div></div>
  <div class="card"><h3>Challenge</h3><div class="note" style="margin-bottom:8px">Your runner fights another player's build using their real gear. Wins earn rating and a little currency. Your own build defends while you're away.</div>${opps.length?opps.map(o=>`<div class="row" style="align-items:center"><div><b>${esc(o.name)}</b><div class="note">Rating ${Math.round(o.rating)} · DPS ${Math.round(o.stats.dps)} · Life ${o.stats.life}</div></div><button class="btn small" data-duel="${esc(o.uid)}" style="width:auto" ${ul?'':'disabled'}>Fight</button></div>`).join(''):'<div class="note">No opponents yet. Get a friend to open the Arena!</div>'}</div>
  <div class="card"><h3>Ladder</h3>${list.slice(0,20).map((o,i)=>`<div class="row"><span style="text-align:left;color:${o.uid===fbUser.uid?'var(--accent)':'var(--ink)'}">${i+1}. ${esc(o.name)}</span><span>${Math.round(o.rating)} · ${o.wins||0}W</span></div>`).join('')||'<div class="note">Empty.</div>'}</div>`;
  document.querySelectorAll('[data-duel]').forEach(x=>x.onclick=()=>fight(list.find(o=>o.uid===x.dataset.duel)))}
function fight(o){if(!o||!usesLeft('arenaAtt',ARENA_PER_DAY))return;useOne('arenaAtt');const me=arenaStats(),res=duel(me,o.stats,(Date.now()&0xffffff));
  const exp=1/(1+Math.pow(10,(o.rating-S.rating)/400)),d=Math.round(32*((res.win?1:0)-exp));
  fightAnim(myName(),o.name,res.aLeft,res.bLeft,res.win,`${res.win?'Victory':'Defeat'} in ${res.t.toFixed(1)}s · rating ${d>=0?'+':''}${d}`,async()=>{
    S.rating=Math.max(100,(S.rating||1000)+d);if(res.win){S.arenaW=(S.arenaW||0)+1;const k=['chaos','crown','ascend'][Math.floor(Math.random()*3)];S.cur[k]=(S.cur[k]||0)+1;S.mats.crystal=(S.mats.crystal||0)+5;toast(`Won! +${d} rating, +1 ${CUR[k].n}, +5 Crystal`)}else{S.arenaL=(S.arenaL||0)+1;toast(`Lost. ${d} rating`)}
    persist();await pushArena();arenaView()},true)}
// ---- shared fight animation
function fightAnim(a,b,aEnd,bEnd,won,line,done,pvp){modal(pvp?'Arena fight':'Raid attack',`<div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px"><span style="color:var(--accent)">${esc(a)}</span><span style="color:#ff8a7a">${esc(b)}</span></div>
  <div style="display:flex;gap:10px"><div style="flex:1;height:12px;background:#120f18;border-radius:6px;overflow:hidden"><div id="fA" style="height:100%;width:100%;background:#5dd68c;transition:width 2.4s ease-in"></div></div><div style="flex:1;height:12px;background:#120f18;border-radius:6px;overflow:hidden"><div id="fB" style="height:100%;width:100%;background:#ff6b5a;transition:width 2.4s ease-in"></div></div></div>
  <div id="fL" class="note" style="margin-top:10px;min-height:20px;text-align:center">Fighting…</div>`,[{label:'…',cls:'ghost',disabled:true}]);
  const btn=document.querySelector('#mBtns .btn');
  setTimeout(()=>{const A=$('#fA'),B=$('#fB');if(A)A.style.width=Math.round(aEnd*100)+'%';if(B)B.style.width=Math.round(bEnd*100)+'%'},60);
  setTimeout(()=>{const L=$('#fL');if(L)L.innerHTML=`<b style="color:${won?'#5dd68c':'#ff9a7a'}">${line}</b>`;if(btn){btn.disabled=false;btn.textContent='OK';btn.onclick=()=>{$('#modal').classList.add('hidden');paused=false;done&&done()}}},2600)}

updTabDots();
window.__ds={essAff,essFits,CUR,AFF,BASES,SPECS,idleRot,idleSet,localStats,empIntro,abyssMods,salv:salvageMats,Sim,computeStats,genItem,weekMods,mkUnique,mkMap,get S(){return S},get sim(){return sim},rollMod,simIdleRun,get pend(){return idlePending}};setTab(S.tab||'run');resize();initCloud();requestAnimationFrame(frame);
})();
</script>
